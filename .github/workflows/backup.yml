name: Firebase Firestore Backup

on:
  schedule:
    # Запускать каждый день в 3:00 ночи (по времени UTC, это 8:00 утра по времени Астаны/Алматы)
    - cron: '0 3 * * *'
  # Позволяет запускать бэкап вручную из интерфейса GitHub Actions
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase

      - name: Run Backup Script
        run: node scripts/backup.js

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup-*.json
          retention-days: 3 # Хранить только 3 дня (автоматически удалять старые)
